<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" role="img" aria-labelledby="dancer-title dancer-description">
  <title id="dancer-title">A colorful illustration of a Balinese dancer</title>
  <desc id="dancer-description">A dancer in a golden headdress and coral-red costume, poised against a warm sunset stage.</desc>
  <defs>
    <linearGradient id="stage" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f19467" />
      <stop offset="1" stop-color="#ca4d3e" />
    </linearGradient>
    <linearGradient id="skirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8c3444" />
      <stop offset="1" stop-color="#492d42" />
    </linearGradient>
    <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#fff3d2" fill-opacity=".42" />
    </pattern>
    <style>
      @keyframes breathe {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-4px) rotate(.3deg); }
      }
      .dancer-figure {
        transform-origin: 50% 70%;
        animation: breathe 5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .dancer-figure { animation: none; }
      }
    </style>
  </defs>
